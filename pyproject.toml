[project]
name = "content-agent-portfolio"
version = "0.1.0"
description = "Multi-agent pipeline that researches, drafts, checks and publishes character-led explainer videos with a human approving every post."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "langgraph>=0.2.60",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.12",
    "jinja2>=3.1.6",
    "pyjwt[crypto]>=2.15.1",
    "edge-tts>=7.3.1",
    "imageio-ffmpeg>=0.6.0",
    "pillow>=13.0.0",
    "beautifulsoup4>=4.15.0",
    "arabic-reshaper>=3.0.1",
    "python-bidi>=0.6.11",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "import-linter>=2.1",
]

[project.scripts]
cap = "cap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cap"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501", "B008"]  # B008: FastAPI's Depends()/Form() in defaults is the framework's idiom

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
packages = ["cap"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

# ---- Layer contracts (M1, ADR-001) -------------------------------------------------
# A module may import modules in the layers below it, never above. "|" marks siblings
# that must not import each other. Every exception is listed under ignore_imports with
# the step that removes it; tests/test_architecture.py fails if the list grows.
[tool.importlinter]
root_package = "cap"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Layers: entry points > web > application > agents and gates > knowledge > adapters > domain"
type = "layers"
layers = [
    "cap.cli",
    "cap.check | cap.smoke",
    "cap.server",
    "cap.worker",
    "cap.ui",
    "cap.approval",
    "cap.demo",
    "cap.pipeline",
    "cap.publisher",
    "cap.release",
    "cap.store",
    "cap.jobs | cap.audit",
    "cap.render",
    "cap.harness | cap.research",
    "cap.gates",
    "cap.agents",
    "cap.post_context",
    "cap.models | cap.routing",
    "cap.prompts | cap.rulebook | cap.characters",
    "cap.pginstall",
    "cap.fetch | cap.connections | cap.setup | cap.updater | cap.instance | cap.lan | cap.localpg",
    "cap.safehttp | cap.secretfile",
    "cap.domain",
    "cap.schema",
    "cap.policy | cap.config | cap.version | cap.console",
]
ignore_imports = []
