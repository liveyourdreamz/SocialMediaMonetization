[project]
name = "content-agent-portfolio"
version = "0.1.0"
description = "Multi-agent pipeline that researches, drafts, checks and publishes character-led explainer videos with a human approving every post."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.12",
    "jinja2>=3.1.6",
    "pyjwt[crypto]>=2.15.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
cap = "cap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cap"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501", "B008"]  # B008: FastAPI's Depends()/Form() in defaults is the framework's idiom

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
packages = ["cap"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
