name: ci

on:
  push:
    branches: [main, bootstrap]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (same command as the launchers)
        run: uv sync --locked --all-extras
      - name: Lint
        run: uv run ruff check src tests scripts && uv run ruff format --check src tests scripts
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov=cap --cov-report=term-missing
      - name: Prompts match the registry
        run: uv run cap prompts check
      - name: Design tokens are current (design/proof/tokens.json -> tokens.css)
        run: uv run cap tokens check
      - name: Schema is current
        run: |
          uv run cap schema export
          git diff --exit-code -- src/cap/schema/post_record.schema.json
      - name: Secret scan (no key-shaped strings in the tree)
        run: |
          ! grep -rEn "sk-ant-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{30,}" --include=*.py --include=*.yaml --include=*.json --include=*.md .
      - name: Smoke (the laptop loop through the real app, from the launcher)
        run: ./run.sh --smoke
      - name: Check (the real-service seams that can run without a key)
        run: uv run cap check --offline
      - name: Fetch real pages over the network (gzip, redirects, Wikipedia)
        # the offline check skips this; 22 Oct every real page failed on the laptop
        run: uv run python -c "from cap.check import _fetch; print(_fetch())"

  windows:
    # The laptop path Hemant actually uses: install.bat (the downloaded bootstrap) fetches
    # the commit under test, hands over to tools\start.bat, which runs the whole loop.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Tests on Windows
        shell: pwsh
        run: |
          uv sync --locked --all-extras
          uv run pytest -q -x --tb=short 2>&1 | Tee-Object -FilePath pytest.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run cap check --offline 2>&1 | Tee-Object -Append -FilePath pytest.txt
          exit $LASTEXITCODE
      - name: Surface the failure as an annotation (log API is not always readable)
        if: failure()
        shell: pwsh
        run: |
          $tail = (Get-Content pytest.txt | Select-Object -Last 60) -join "%0A"
          Write-Output "::error title=pytest on Windows::$tail"
      - name: install.bat end to end
        shell: cmd
        env:
          CAP_BRANCH: ${{ github.head_ref || github.ref_name }}
          CAP_DIR: ${{ github.workspace }}\laptop
          CAP_SMOKE: "1"
        run: |
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
          call install.bat > install.txt 2>&1
          type install.txt
          if errorlevel 1 exit /b 1
      - name: Surface install.bat output as an annotation
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path install.txt) { $tail = (Get-Content install.txt | Select-Object -Last 60) -join "%0A"; Write-Output "::error title=install.bat on Windows::$tail" }
      - name: run.ps1 parses
        shell: pwsh
        run: $null = [scriptblock]::Create((Get-Content -Raw run.ps1)); "ok"
