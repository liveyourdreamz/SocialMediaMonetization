name: ci

on:
  push:
    branches: [main, bootstrap]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv venv --python 3.12 .venv
          uv pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check src tests scripts && .venv/bin/ruff format --check src tests scripts
      - name: Types
        run: .venv/bin/mypy
      - name: Tests
        run: .venv/bin/pytest --cov=cap --cov-report=term-missing
      - name: Prompts match the registry
        run: .venv/bin/python -m cap.cli prompts check
      - name: Schema is current
        run: |
          .venv/bin/python -m cap.cli schema export
          git diff --exit-code -- src/cap/schema/post_record.schema.json
      - name: Secret scan (no key-shaped strings in the tree)
        run: |
          ! grep -rEn "sk-ant-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{30,}" --include=*.py --include=*.yaml --include=*.json --include=*.md .
