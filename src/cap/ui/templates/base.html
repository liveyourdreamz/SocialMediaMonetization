<!doctype html>
<html lang="{{ 'ar' if rtl else 'en' }}" dir="{{ 'rtl' if rtl else 'ltr' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>{% block title %}Content Agent Portfolio{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Noto+Naskh+Arabic:wght@400;600&family=IBM+Plex+Mono&display=swap">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/proof.css">
</head>
<body>
<div class="app">
{% if paused %}
<div class="band" role="status">
  <span><strong>Queue paused.</strong> A canary got through; nothing publishes until it is reopened.</span>
  <a href="/paused">Read why</a>
</div>
{% endif %}
{% block body %}{% endblock %}
{% if reviewer and reviewer.is_approver and tab is defined %}
<nav class="tabs" aria-label="Main">
  <a href="/" {% if tab == 'portfolio' %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Portfolio</a>
  <a href="/queue" {% if tab == 'queue' %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h6"/></svg>Queue{% if queue_count %}<span class="badge" aria-label="{{ queue_count }} waiting">{{ queue_count }}</span>{% endif %}</a>
  <a href="/digest" {% if tab == 'digest' %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4zM8 9h8M8 13h8M8 17h5"/></svg>Digest</a>
  <a href="/operator" {% if tab == 'operator' %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>Operator</a>
</nav>
{% endif %}
</div>
<script src="/static/proof.js" defer></script>
</body>
</html>
